# XcodeGen spec for the PQ-Identity v4 phone prover app (docs/v4/PHONE_PROTOCOL.md).
# Generate the Xcode project on a Mac:  cd mobile/mopro/ios && xcodegen generate
# (XcodeGen: https://github.com/yonaskolb/XcodeGen, `brew install xcodegen`.)
#
# The zkey and the input are referenced IN PLACE from the repo (setup/out/v4, mobile/inputs)
# and copied into the app bundle by Xcode at build time; the repo holds no second copy.
# MoproiOSBindings/ (mopro.swift + MoproBindings.xcframework) is produced by
# mobile/mopro/scripts/build_bindings.sh and is gitignored.
# UNTESTED: written on a Windows host without Xcode or XcodeGen.

name: PQIDPhone
options:
  bundleIdPrefix: org.pqid.dev          # [VERIFY] set your own prefix for device signing
  deploymentTarget:
    iOS: "16.0"                         # ShareLink needs iOS 16; Mopro's template uses 18.0 [VERIFY]
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PQID_MOPRO_CLI_VERSION: "0.3.7"
    # The Mopro template links the C++ runtime for the static bindings library.
    OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  PQIDPhone:
    type: application
    platform: iOS
    sources:
      - path: PQIDPhone
        excludes:
          - Info.plist
      - path: MoproiOSBindings/mopro.swift
      - path: ../../../setup/out/v4/credential_auth_v4_dev.zkey
        buildPhase: resources
        type: file
      - path: ../../inputs/v4_input.mopro.json
        buildPhase: resources
        type: file
      - path: ../../inputs/v4_input.meta.json
        buildPhase: resources
        type: file
    dependencies:
      - framework: MoproiOSBindings/MoproBindings.xcframework
        embed: false                    # static library, as in Mopro's iOS template
    info:
      path: PQIDPhone/Info.plist        # generated by xcodegen (gitignored)
      properties:
        CFBundleDisplayName: PQID v4
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true      # logs visible in the Files app and Finder
        LSSupportsOpeningDocumentsInPlace: true
        PQIDMoproCliVersion: $(PQID_MOPRO_CLI_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.pqid.dev.PQIDPhone   # [VERIFY] must be unique for your team
  PQIDPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PQIDPhoneTests
    dependencies:
      - target: PQIDPhone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: org.pqid.dev.PQIDPhoneTests
schemes:
  PQIDPhone:
    build:
      targets:
        PQIDPhone: all
        PQIDPhoneTests: [test]
    run:
      config: Release                   # device timing runs use the Release build
    test:
      config: Debug                     # @testable import needs testability (Debug)
      gatherCoverageData: false
      targets:
        - PQIDPhoneTests
      # PQID_WARM_RUNS (default 0) reaches the test through xcodebuild's TEST_RUNNER_ prefix:
      #   TEST_RUNNER_PQID_WARM_RUNS=3 xcodebuild ... test
